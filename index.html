<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liens - Motos Stars Ndjamena</title>
        <link rel="icon" type="image/png" href="./logo.png">
    <style>
        /* --- Styles de base --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa; /* Fond gris très clair */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px; /* Largeur parfaite pour téléphone */
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        /* --- En-tête (Logo et Textes) --- */
        .logo {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid #111;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            color: #111;
            font-weight: 800;
        }

        p {
            color: #555;
            margin-top: 8px;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* --- Les Boutons --- */
        .btn-lien {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        .btn-lien:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        /* Couleurs spécifiques aux réseaux */
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
        }

        .btn-tiktok {
            background-color: #000000;
            color: white;
        }

        .btn-insta {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }

        .btn-site {
            background-color: #1a365d; /* Bleu sombre pro */
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Logo Motos Stars" class="logo">
        
        <h1>Motos Stars Ndjamena</h1>
        <p>Vente de motos neuves & Paiement en tranches</p>

        <a href="https://wa.me/23560304861?text=Bonjour,%20je%20vous%20contacte%20depuis%20vos%20réseaux" class="btn-lien btn-whatsapp" target="_blank">
            📱 Discuter sur WhatsApp
        </a>
        
        <!-- Lien vers mon catalogue web -->
        <a href="https://motos-stars-ndjamena.github.io/MSN/#" class="btn-lien btn-site" target="_blank">
            🌐 Voir le catalogue des motos
        </a>

        <!-- Lien TikTok (Déjà configuré avec ton compte) -->
        <a href="https://www.tiktok.com/@motos.stars.ndjam" class="btn-lien btn-tiktok" target="_blank">
            🎵 Nous suivre sur TikTok
        </a>
        
        <!-- Lien Instagram (Déjà configuré avec ton compte) -->
        <a href="https://www.instagram.com/motos_stars_ndjamena" class="btn-lien btn-insta" target="_blank">
            📸 Nous suivre sur Instagram
        </a>
    </div>

</body>
</html>
